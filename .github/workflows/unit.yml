name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Vitest unit (no live DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit
