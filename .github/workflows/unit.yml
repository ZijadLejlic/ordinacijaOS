name: Unit tests

on:
  workflow_call:

jobs:
  unit:
    name: Vitest unit (no live DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run unit tests with coverage gate
        run: npm run test:coverage
